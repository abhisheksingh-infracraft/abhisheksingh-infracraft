<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative GitOps deployment workflow</title><desc id="desc">A conceptual flow from a Git commit through CI checks to Argo CD reconciliation and a Kubernetes cluster, with health feedback.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#10273b"/></linearGradient><style>.b{fill:#0d2033;stroke:#3b82f6;stroke-width:2}.t{fill:#e6edf3;font:18px Arial,sans-serif}.s{fill:#9db5ca;font:14px Arial,sans-serif}.l{stroke:#22d3ee;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6" fill="#22d3ee"/></marker></defs>
  <rect width="1200" height="390" rx="22" fill="url(#bg)"/><text x="42" y="50" class="t" font-size="24">GitOps workflow | conceptual learning diagram</text>
  <g><rect x="55" y="131" width="205" height="112" rx="13" class="b"/><text x="92" y="174" class="t">Git repository</text><text x="83" y="205" class="s">desired state / Helm</text><rect x="335" y="131" width="205" height="112" rx="13" class="b"/><text x="372" y="174" class="t">CI validation</text><text x="367" y="205" class="s">lint / test / build</text><rect x="615" y="131" width="205" height="112" rx="13" class="b"/><text x="650" y="174" class="t">Argo CD</text><text x="644" y="205" class="s">compare / reconcile</text><rect x="895" y="131" width="245" height="112" rx="13" class="b"/><text x="930" y="174" class="t">Kubernetes cluster</text><text x="936" y="205" class="s">running workloads</text></g>
  <path d="M260 187h75M540 187h75M820 187h75" class="l"/><path d="M1015 245v69H715v-70" class="l"/><text x="776" y="342" class="s">health + drift feedback</text><text x="57" y="300" class="s">Changes are proposed through version control; reconciliation and rollback behavior must be configured and verified.</text>
</svg>
