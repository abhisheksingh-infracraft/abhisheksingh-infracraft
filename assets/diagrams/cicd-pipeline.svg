<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative CI/CD pipeline architecture</title><desc id="desc">Conceptual GitHub Actions pipeline from source change through checks, container image publication, and deployment.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#10273b"/></linearGradient><style>.b{fill:#0d2033;stroke:#3b82f6;stroke-width:2}.t{fill:#e6edf3;font:18px Arial,sans-serif}.s{fill:#9db5ca;font:14px Arial,sans-serif}.l{stroke:#22d3ee;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6" fill="#22d3ee"/></marker></defs>
  <rect width="1200" height="390" rx="22" fill="url(#bg)"/><text x="42" y="50" class="t" font-size="24">CI/CD pipeline | conceptual learning diagram</text>
  <rect x="52" y="132" width="190" height="108" rx="13" class="b"/><text x="96" y="174" class="t">Git commit</text><text x="84" y="205" class="s">PR / push trigger</text><rect x="300" y="132" width="210" height="108" rx="13" class="b"/><text x="342" y="174" class="t">Actions checks</text><text x="332" y="205" class="s">lint · test · scan</text><rect x="570" y="132" width="210" height="108" rx="13" class="b"/><text x="607" y="174" class="t">Build image</text><text x="601" y="205" class="s">tag immutable digest</text><rect x="840" y="132" width="205" height="108" rx="13" class="b"/><text x="871" y="174" class="t">Artifact Registry</text><text x="881" y="205" class="s">publish / attest</text><rect x="1070" y="132" width="100" height="108" rx="13" class="b"/><text x="1082" y="174" class="t">Deploy</text><text x="1083" y="205" class="s">manual gate</text>
  <path d="M242 186h58M510 186h60M780 186h60M1045 186h25" class="l"/><text x="55" y="302" class="s">Illustrative only: use least-privilege permissions, protected environments, pinned actions, and secretless OIDC where supported.</text>
</svg>
