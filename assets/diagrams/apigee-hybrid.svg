<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Apigee Hybrid architecture</title><desc id="desc">Conceptual separation between Apigee management plane and customer-managed runtime on GKE, with ingress and backend services.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#10273b"/></linearGradient><style>.b{fill:#0d2033;stroke:#3b82f6;stroke-width:2}.t{fill:#e6edf3;font:18px Arial,sans-serif}.s{fill:#9db5ca;font:14px Arial,sans-serif}.l{stroke:#22d3ee;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6" fill="#22d3ee"/></marker></defs>
  <rect width="1200" height="480" rx="22" fill="url(#bg)"/><text x="42" y="50" class="t" font-size="24">Apigee Hybrid | conceptual architecture</text>
  <rect x="70" y="100" width="440" height="280" rx="16" fill="#0a1828" stroke="#60a5fa" stroke-width="2"/><text x="95" y="137" class="t">Google-managed management plane</text><rect x="112" y="170" width="160" height="85" rx="11" class="b"/><text x="136" y="207" class="t">Apigee UI / API</text><text x="137" y="232" class="s">config / analytics</text><rect x="305" y="170" width="168" height="85" rx="11" class="b"/><text x="333" y="207" class="t">Control plane</text><text x="333" y="232" class="s">runtime config sync</text>
  <rect x="575" y="100" width="555" height="280" rx="16" fill="#0a1828" stroke="#22d3ee" stroke-width="2"/><text x="600" y="137" class="t">Customer-managed runtime · GKE</text><rect x="612" y="170" width="135" height="85" rx="11" class="b"/><text x="640" y="207" class="t">Ingress</text><text x="637" y="232" class="s">north-south</text><rect x="782" y="170" width="160" height="85" rx="11" class="b"/><text x="800" y="207" class="t">Message</text><text x="804" y="232" class="s">processor</text><rect x="978" y="170" width="125" height="85" rx="11" class="b"/><text x="997" y="207" class="t">Backend</text><text x="990" y="232" class="s">services</text><rect x="760" y="292" width="225" height="54" rx="10" class="b"/><text x="784" y="326" class="s">Cassandra / runtime state</text>
  <path d="M272 212h33M473 212h139M747 212h35M942 212h36M682 255v64h78" class="l"/><text x="76" y="427" class="s">Conceptual only. Hybrid components, supported versions, sizing, networking, and upgrade procedure must follow official product documentation.</text>
</svg>
