<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Kubernetes monitoring architecture</title><desc id="desc">Conceptual Prometheus scraping metrics from workloads and nodes, with Grafana dashboards and alert routing.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#10273b"/></linearGradient><style>.b{fill:#0d2033;stroke:#3b82f6;stroke-width:2}.t{fill:#e6edf3;font:18px Arial,sans-serif}.s{fill:#9db5ca;font:14px Arial,sans-serif}.l{stroke:#22d3ee;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6" fill="#22d3ee"/></marker></defs>
  <rect width="1200" height="420" rx="22" fill="url(#bg)"/><text x="42" y="50" class="t" font-size="24">Observability | conceptual learning diagram</text>
  <rect x="55" y="118" width="280" height="116" rx="13" class="b"/><text x="89" y="160" class="t">Kubernetes workloads</text><text x="95" y="192" class="s">app / node exporters</text><rect x="450" y="118" width="260" height="116" rx="13" class="b"/><text x="520" y="160" class="t">Prometheus</text><text x="493" y="192" class="s">scrape · store · evaluate</text><rect x="830" y="80" width="285" height="105" rx="13" class="b"/><text x="912" y="122" class="t">Grafana</text><text x="882" y="153" class="s">dashboards / exploration</text><rect x="830" y="230" width="285" height="105" rx="13" class="b"/><text x="902" y="272" class="t">Alert routing</text><text x="868" y="303" class="s">rules → receiver / on-call</text>
  <path d="M335 176h115M710 151h120M710 201q65 0 120 80" class="l"/><path d="M830 280q-95 110-240 20" class="l"/><text x="470" y="348" class="s">feedback to operations</text><text x="58" y="385" class="s">Illustrative components; metrics, retention, access control, and alert policy require workload-specific design.</text>
</svg>
