<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative GCP network and GKE architecture</title><desc id="desc">A conceptual diagram of a Google Cloud VPC with public and private subnets, Cloud Router and NAT, and a private GKE cluster.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#10273b"/></linearGradient><style>.box{fill:#0d2033;stroke:#3b82f6;stroke-width:2}.txt{fill:#e6edf3;font:18px Arial,sans-serif}.small{fill:#9db5ca;font:14px Arial,sans-serif}.line{stroke:#22d3ee;stroke-width:3;fill:none;marker-end:url(#arrow)}</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6" fill="#22d3ee"/></marker></defs>
  <rect width="1200" height="480" rx="22" fill="url(#bg)"/><text x="42" y="50" class="txt" font-size="24">GCP network + GKE | conceptual learning diagram</text>
  <rect x="55" y="100" width="1090" height="325" rx="18" fill="#0a1828" stroke="#60a5fa" stroke-dasharray="9 7" stroke-width="2"/><text x="78" y="133" class="small">Google Cloud project · VPC network</text>
  <rect x="95" y="179" width="168" height="88" rx="12" class="box"/><text x="125" y="216" class="txt">Internet</text><text x="117" y="242" class="small">external routes</text>
  <rect x="340" y="179" width="190" height="88" rx="12" class="box"/><text x="371" y="216" class="txt">Cloud Router</text><text x="366" y="242" class="small">dynamic routing</text>
  <rect x="340" y="306" width="190" height="78" rx="12" class="box"/><text x="390" y="340" class="txt">Cloud NAT</text><text x="370" y="364" class="small">controlled egress</text>
  <rect x="625" y="160" width="465" height="225" rx="16" fill="#0d2033" stroke="#22d3ee" stroke-width="2"/><text x="650" y="194" class="txt">Private subnet · GKE</text>
  <rect x="660" y="222" width="175" height="110" rx="12" class="box"/><text x="688" y="260" class="txt">Node pool</text><text x="678" y="288" class="small">workload nodes</text>
  <rect x="866" y="222" width="188" height="110" rx="12" class="box"/><text x="895" y="260" class="txt">Pods / Services</text><text x="887" y="288" class="small">sample application</text>
  <path d="M263 220h77M530 220h95M435 267v39M835 276h31" class="line"/><path d="M530 345h65q30 0 30-30v-72" class="line"/>
  <text x="78" y="455" class="small">Illustrative only — not a deployed environment or production architecture.</text>
</svg>
