<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative Kubernetes cluster architecture</title><desc id="desc">Conceptual Kubernetes API and control plane connected to worker nodes hosting pods, services, ingress, and autoscaling.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081321"/><stop offset="1" stop-color="#10273b"/></linearGradient><style>.b{fill:#0d2033;stroke:#3b82f6;stroke-width:2}.t{fill:#e6edf3;font:18px Arial,sans-serif}.s{fill:#9db5ca;font:14px Arial,sans-serif}.l{stroke:#22d3ee;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 9 3 0 6" fill="#22d3ee"/></marker></defs>
  <rect width="1200" height="480" rx="22" fill="url(#bg)"/><text x="42" y="50" class="t" font-size="24">Kubernetes cluster | conceptual learning diagram</text>
  <rect x="72" y="102" width="305" height="286" rx="16" fill="#0a1828" stroke="#60a5fa" stroke-width="2"/><text x="98" y="139" class="t">Control plane</text><rect x="103" y="166" width="245" height="66" rx="10" class="b"/><text x="130" y="206" class="t">API server</text><rect x="103" y="258" width="110" height="88" rx="10" class="b"/><text x="117" y="296" class="s">Scheduler</text><text x="116" y="322" class="s">Controller</text><rect x="235" y="258" width="112" height="88" rx="10" class="b"/><text x="249" y="296" class="s">etcd</text><text x="249" y="322" class="s">desired state</text>
  <rect x="430" y="102" width="700" height="286" rx="16" fill="#0a1828" stroke="#22d3ee" stroke-width="2"/><text x="456" y="139" class="t">Worker nodes</text>
  <rect x="466" y="172" width="285" height="170" rx="12" class="b"/><text x="488" y="205" class="t">Node A</text><rect x="490" y="226" width="104" height="85" rx="9" fill="#112b40" stroke="#22d3ee"/><text x="509" y="265" class="s">Pod</text><text x="502" y="288" class="s">app</text><rect x="616" y="226" width="110" height="85" rx="9" fill="#112b40" stroke="#22d3ee"/><text x="636" y="265" class="s">Pod</text><text x="629" y="288" class="s">sidecar</text>
  <rect x="785" y="172" width="310" height="170" rx="12" class="b"/><text x="808" y="205" class="t">Traffic &amp; scale</text><text x="808" y="248" class="s">Ingress → Service → Pods</text><text x="808" y="280" class="s">HPA adjusts replica count</text><text x="808" y="312" class="s">RBAC + NetworkPolicy</text>
  <path d="M377 215h89M751 257h34" class="l"/><text x="75" y="440" class="s">Illustrative components only; cluster details depend on distribution and configuration.</text>
</svg>
